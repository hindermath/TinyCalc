name: ci

on:
  push:
    branches:
      - main
      - codex/**
      - claude/**
      - gemini/**
      - copilot/**
      - pencode/**
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore MicroCalc.sln

      - name: Build
        run: dotnet build MicroCalc.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MicroCalc.sln --configuration Release --no-build

      - name: Smoke
        shell: pwsh
        run: |
          $smokeOutput = @(
            dotnet run --no-build --configuration Release --project src/MicroCalc.Tui/MicroCalc.Tui.csproj -- --smoke
          )
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($smokeOutput.Count -ne 1 -or $smokeOutput[0] -cne 'SMOKE_OK') {
            throw 'Smoke output must be exactly SMOKE_OK.'
          }
          $smokeOutput
