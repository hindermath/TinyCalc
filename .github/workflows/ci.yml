name: ci

on:
  push:
    branches:
      - main
      - codex/**
      - claude/**
      - gemini/**
      - copilot/**
      - pencode/**
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate RL-SE assessment (PowerShell)
        shell: pwsh
        run: |
          ./scripts/validate-rl-se-assessment.ps1 -Assessment docs/security/secure-development/2026-09-05-rl-se-self-assessment/assessment-matrix.json
          $fixture = Join-Path $env:RUNNER_TEMP 'rlse-invalid-extra-property.json'
          $stdout = Join-Path $env:RUNNER_TEMP 'rlse-schema-negative.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'rlse-schema-negative.stderr.txt'
          $matrix = Get-Content docs/security/secure-development/2026-09-05-rl-se-self-assessment/assessment-matrix.json -Raw | ConvertFrom-Json
          $matrix | Add-Member -NotePropertyName unexpectedField -NotePropertyValue $true
          $matrix | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $fixture -Encoding utf8
          $process = Start-Process -FilePath pwsh -ArgumentList @(
            '-NoProfile', '-File', './scripts/validate-rl-se-assessment.ps1',
            '-Assessment', $fixture
          ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $failureText = (Get-Content -LiteralPath $stdout, $stderr -Raw) -join "`n"
          if ($process.ExitCode -ne 2 -or $failureText -notmatch 'Matrix verletzt das JSON-Schema') {
            throw 'RL-SE schema-negative fixture did not fail as required.'
          }

      - name: Validate RL-SE assessment (Bash)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/validate-rl-se-assessment.sh --assessment docs/security/secure-development/2026-09-05-rl-se-self-assessment/assessment-matrix.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore MicroCalc.sln

      - name: Build
        run: dotnet build MicroCalc.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MicroCalc.sln --configuration Release --no-build

      - name: Smoke
        shell: pwsh
        run: |
          $smokeOutput = @(
            dotnet run --no-build --configuration Release --project src/MicroCalc.Tui/MicroCalc.Tui.csproj -- --smoke
          )
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($smokeOutput.Count -ne 1 -or $smokeOutput[0] -cne 'SMOKE_OK') {
            throw 'Smoke output must be exactly SMOKE_OK.'
          }
          $smokeOutput
